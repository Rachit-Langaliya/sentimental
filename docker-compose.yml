version: '3.9'

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-sih}:${POSTGRES_PASSWORD:-sihpass}@postgres:5432/${POSTGRES_DB:-sih_intelligence}
  REDIS_URL: redis://redis:6379/0
  USE_REAL_NLP: ${USE_REAL_NLP:-false}
  DEMO_MODE: ${DEMO_MODE:-true}
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sih.gov.in}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@SIH2026}
  ADMIN_NAME: ${ADMIN_NAME:-Platform Administrator}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
  OLLAMA_BASE_URL: http://ollama:11434

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sih_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sihpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih} -d ${POSTGRES_DB:-sih_intelligence}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sih_redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_backend
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_worker
    init: true
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache/huggingface
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -Q celery
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_beat
    init: true
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    restart: unless-stopped

  seeder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih_seeder
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m app.scripts.seed_demo
    profiles:
      - seed
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sih_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: sih_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    profiles:
      - llm
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
  model_cache:
